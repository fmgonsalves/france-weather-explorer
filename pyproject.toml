[project]
name = "weather-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.4.2",
    "dash>=4.4.0",
    "duckdb>=1.3.2",
    "ipykernel>=7.3.0",
    "plotly>=6.9.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "pytz>=2025.2",
    "requests>=2.34.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[project.scripts]
weather-analysis = "weather_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
